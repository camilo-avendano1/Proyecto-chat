# ==============================================================================
# Configuración SonarQube (Self-Hosted) — Plataforma Atenta
# ==============================================================================
sonar.projectKey=atenta-platform
sonar.projectName=Atenta
sonar.sourceEncoding=UTF-8

# Fuentes de código backend (Python/FastAPI) y frontend (React/Vite)
sonar.sources=codigo/auth-service/src,codigo/llm-gateway/src,codigo/back-chat/src,codigo/front-admin/src,codigo/FRONT-MOCK/src
sonar.tests=codigo/auth-service/tests,codigo/llm-gateway/tests,codigo/back-chat/tests

sonar.exclusions=**/node_modules/**,**/dist/**,**/__pycache__/**,**/.pytest_cache/**,**/logs/**,**/data/**,reports/**,reuniones/**,.agents/**,.claude/**,.scannerwork/**

# Python & reportes de cobertura/pruebas/seguridad
sonar.python.version=3.13
sonar.python.coverage.reportPaths=reports/coverage-auth-service.xml,reports/coverage-llm-gateway.xml,reports/coverage-back-chat.xml
sonar.python.xunit.reportPath=reports/junit-*.xml
sonar.python.bandit.reportPaths=reports/bandit-report.json
